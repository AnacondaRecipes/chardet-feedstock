{% set version = "5.0.0" %}

package:
  name: chardet
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/c/chardet/chardet-{{ version }}.tar.gz
  sha256: 0368df2bfd78b5fc20572bb4e9bb7fb53e2c094f60ae9993339e8671d0afb8aa 

build:
  number: 0 
  script: "{{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv"
  entry_points:
    - chardetect = chardet.cli.chardetect:main

requirements:
  host:
    - python
    - setuptools
    - wheel
    - pip
    - pytest-runner
  run:
    - python

test:
  imports:
    - chardet
  requires:
    - pip
  commands:
    - pip check
    - chardetect --help

about:
  home: https://github.com/chardet/chardet
  license: LGPL-2.1-only 
  license_family: GPL
  license_file: LICENSE
  summary: Universal character encoding detector
  description: |
    chardet is a character encoding auto-detector in Python.
  doc_url: https://chardet.readthedocs.io/en/latest/ 
  dev_url: https://github.com/chardet/chardet


extra:
  recipe-maintainers:
    - dan-blanchard
    - jschueller
    - sigmavirus24
    - nehaljwani
